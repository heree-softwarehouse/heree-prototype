<!doctype html><html><head><meta charset="utf-8"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:
    radial-gradient(900px 600px at 10% -10%, rgba(28,39,64,0.6), transparent 55%),
    radial-gradient(700px 500px at 110% 110%, rgba(255,122,69,0.10), transparent 55%),
    #060A14;color:#F5F7FA;font-family:var(--font-sans);height:100%;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:20px}
  button{font-family:inherit;cursor:pointer;font-weight:500;letter-spacing:-0.01em}

  .primary{height:48px;padding:0 26px;border:none;border-radius:24px;font-size:15px;color:#0B1220;
    background:#FF7A45;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 20px -6px rgba(255,122,69,0.5)}
  .ghost{height:40px;padding:0 18px;border-radius:22px;background:transparent;border:0.5px solid rgba(184,194,208,0.28);color:#F5F7FA;font-size:13px}
  .disabled{height:48px;padding:0 26px;border-radius:24px;font-size:15px;font-weight:500;
    background:transparent;border:0.5px solid rgba(184,194,208,0.28);color:#7A8499;cursor:not-allowed}
  .lbl{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:9px;color:#7A8499;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap}
  .wrap{position:relative}
</style></head><body>
<div class="wrap"><button class="primary">Wyślij kod →</button><div class="lbl">primary</div></div>
<div class="wrap"><button class="ghost">zmień numer</button><div class="lbl">ghost</div></div>
<div class="wrap"><button class="disabled">Wyślij kod →</button><div class="lbl">disabled · outline</div></div>
</body></html>
