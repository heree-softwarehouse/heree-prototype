<!doctype html><html><head><meta charset="utf-8"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;background:#0B1220;color:#F5F7FA;font-family:var(--font-sans);height:100%;}
.wrap{padding:18px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border-radius:14px;height:86px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;font-size:10.5px;color:#0B1220}
.sw .hex{font-family:var(--font-mono)}
.sw .nm{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.16em;font-size:9px}
</style></head><body><div class="wrap">
<div class="sw" style="background:#FFA478;"><span class="nm">accent-soft</span><span class="hex">#FFA478</span></div>
<div class="sw" style="background:#FF7A45;"><span class="nm">accent ★</span><span class="hex">#FF7A45</span></div>
<div class="sw" style="background:#E85F2C;color:#fff;"><span class="nm">accent-deep</span><span class="hex">#E85F2C</span></div>
<div class="sw" style="background:#FFC368;"><span class="nm">gloss</span><span class="hex">#FFC368</span></div>
</div></body></html>
