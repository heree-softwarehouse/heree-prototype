<!doctype html><html><head><meta charset="utf-8"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;background:#0B1220;color:#F5F7FA;font-family:var(--font-sans);height:100%;}
.wrap{padding:18px 22px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{border-radius:14px;height:86px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;border:0.5px solid rgba(184,194,208,0.28);font-size:10.5px}
.sw .hex{font-family:var(--font-mono);letter-spacing:0.02em}
.sw .nm{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.16em;font-size:9px;opacity:0.9}
</style></head><body><div class="wrap">
<div class="sw" style="background:#060A14;"><span class="nm">bg-0</span><span class="hex">#060A14</span></div>
<div class="sw" style="background:#0B1220;"><span class="nm">bg-1</span><span class="hex">#0B1220</span></div>
<div class="sw" style="background:#131C2E;"><span class="nm">bg-2</span><span class="hex">#131C2E</span></div>
<div class="sw" style="background:#1C2740;"><span class="nm">bg-3</span><span class="hex">#1C2740</span></div>
<div class="sw" style="background:#2A3654;"><span class="nm">bg-4</span><span class="hex">#2A3654</span></div>
</div></body></html>
