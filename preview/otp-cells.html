<!doctype html><html><head><meta charset="utf-8"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:#0B1220;color:#F5F7FA;font-family:-apple-system,sans-serif;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.cell{aspectRatio:0.88;width:44px;height:50px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;margin:0 4px;background:rgba(184,194,208,0.07)}
.rest{border:0.5px solid rgba(184,194,208,0.28);color:#F5F7FA}
.active{border:1px solid #FF7A45;box-shadow:0 0 0 4px rgba(255,122,69,0.11);color:#FF7A45}
.err{background:rgba(255,107,122,0.16);border:1px solid #FF6B7A;color:#FF6B7A}
.caret{width:2px;height:22px;background:#FF7A45;display:inline-block}
</style></head><body>
<div class="cell rest">4</div>
<div class="cell rest">8</div>
<div class="cell active"><span class="caret"></span></div>
<div class="cell rest"></div>
<div class="cell err">!</div>
<div class="cell err">!</div>
</body></html>
