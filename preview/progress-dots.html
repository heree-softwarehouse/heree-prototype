<!doctype html><html><head><meta charset="utf-8"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:#0B1220;color:#F5F7FA;font-family:-apple-system,sans-serif;height:100%;display:flex;align-items:center;justify-content:center;gap:30px;padding:20px}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(184,194,208,0.14);transition:all 0.35s}
.dot.done{background:rgba(255,122,69,0.6)}
.dot.active{background:#FF7A45;width:18px;border-radius:100px;box-shadow:0 0 12px rgba(255,138,91,0.6)}
.lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7A8499;letter-spacing:0.18em;text-transform:uppercase}
</style></head><body>
<div class="dots"><div class="dot done"></div><div class="dot done"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
<div class="lbl">03 Kod SMS</div>
</body></html>
