<!doctype html><html><head><meta charset="utf-8"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:#0B1220;color:#F5F7FA;font-family:-apple-system,sans-serif;height:100%}
.wrap{padding:20px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{background:#FF7A45;border-radius:3px;width:100%}
.lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:#7A8499;letter-spacing:0.12em}
</style></head><body><div class="wrap">
<div class="col"><div class="bar" style="height:4px"></div><div class="lbl">1 · 4</div></div>
<div class="col"><div class="bar" style="height:8px"></div><div class="lbl">2 · 8</div></div>
<div class="col"><div class="bar" style="height:12px"></div><div class="lbl">4 · 12</div></div>
<div class="col"><div class="bar" style="height:16px"></div><div class="lbl">6 · 16</div></div>
<div class="col"><div class="bar" style="height:20px"></div><div class="lbl">8 · 20</div></div>
<div class="col"><div class="bar" style="height:24px"></div><div class="lbl">9 · 24</div></div>
<div class="col"><div class="bar" style="height:28px"></div><div class="lbl">10 · 28</div></div>
</div></body></html>
