<!doctype html><html><head><meta charset="utf-8"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:radial-gradient(500px 400px at 20% 20%,rgba(255,122,69,0.18),transparent 60%),#0B1220;color:#F5F7FA;font-family:-apple-system,sans-serif;height:100%}
.wrap{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:16px;padding:14px 16px}
.glass{background:rgba(184,194,208,0.08);border:0.5px solid rgba(184,194,208,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 6px 24px rgba(0,0,0,0.35);backdrop-filter:blur(20px) saturate(180%)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:100px;background:rgba(184,194,208,0.08);border:0.5px solid rgba(184,194,208,0.14);font-size:11px;color:#B8C2D0}
.lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:#7A8499;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:8px}
</style></head><body><div class="wrap">
<div class="card glass"><div class="lbl">.glass surface</div><div style="font-size:13px;color:#B8C2D0">rgba(184,194,208,0.08) · blur 20 · 0.5px stroke</div></div>
<div class="card glass" style="display:flex;gap:8px;align-items:center"><span class="chip">szyfrowane</span><span class="chip" style="background:rgba(255,122,69,0.16);color:#FF7A45;border-color:transparent">500 m</span></div>
</div></body></html>
