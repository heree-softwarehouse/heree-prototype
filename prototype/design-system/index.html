<head>

  <title>Heree · Design system</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0F0B06; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .menu { position: fixed; top: 18px; left: 18px; z-index: 20; }
    .menu summary { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(15,17,24,0.9); border: 1px solid rgba(232,200,150,0.2); color: #F2EDE6; cursor: pointer; list-style: none; backdrop-filter: blur(24px); }
    .menu summary::-webkit-details-marker { display: none; }
    .menu summary span, .menu summary span::before, .menu summary span::after { display: block; width: 18px; height: 2px; border-radius: 2px; background: currentColor; }
    .menu summary span { position: relative; }
    .menu summary span::before, .menu summary span::after { content: ""; position: absolute; left: 0; }
    .menu summary span::before { top: -6px; }
    .menu summary span::after { top: 6px; }
    .menu nav { margin-top: 10px; min-width: 180px; padding: 8px; border-radius: 18px; background: rgba(15,17,24,0.94); border: 1px solid rgba(232,200,150,0.18); box-shadow: 0 16px 38px rgba(0,0,0,0.38); backdrop-filter: blur(24px); }
    .menu a { display: block; padding: 11px 12px; border-radius: 12px; color: #B5A898; text-decoration: none; font-size: 13px; font-weight: 650; }
    .menu a:hover, .menu a.active { color: #E8901A; background: rgba(232,144,26,0.14); }
  </style>
</head>
