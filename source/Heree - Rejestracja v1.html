<title>Heree — Rejestracja</title>
<style>
/* Heree — Liquid Glass iOS */
:root {
  --accent: #FF5E3A;
  --accent-light: #FF8A65;
  --accent-deep: #E8441E;
  --text: #1a1411;
  --muted: #6b5e57;
  --ink-05: rgba(26,20,17,0.05);
  --ink-10: rgba(26,20,17,0.10);
  --ink-20: rgba(26,20,17,0.20);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #e8e4df;
  min-height: 100vh;
}

body {
  background:
    radial-gradient(1200px 800px at 10% -10%, #f6e9d8 0%, transparent 60%),
    radial-gradient(1000px 700px at 120% 100%, #f3d9c3 0%, transparent 55%),
    #ece6df;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}

/* App ambient background (lives inside device) */
.heree-ambient {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 0;
}
.heree-ambient::before,
.heree-ambient::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.85;
}
.heree-ambient::before {
  width: 420px; height: 420px;
  background: radial-gradient(circle, #FFB38A 0%, #FF7A45 55%, transparent 70%);
  top: -120px; left: -80px;
  animation: blobA 18s ease-in-out infinite;
}
.heree-ambient::after {
  width: 380px; height: 380px;
  background: radial-gradient(circle, #FFD7A8 0%, #FF9466 60%, transparent 75%);
  bottom: -140px; right: -100px;
  animation: blobB 22s ease-in-out infinite;
}
@keyframes blobA {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, 60px) scale(1.1); }
}
@keyframes blobB {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-30px, -40px) scale(1.08); }
}

/* Liquid glass surface */
.glass {
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 0.5px solid rgba(255,255,255,0.6);
  box-shadow:
    inset 1.5px 1.5px 1px rgba(255,255,255,0.7),
    inset -1px -1px 1px rgba(255,255,255,0.3),
    0 6px 24px rgba(138, 67, 30, 0.08),
    0 2px 6px rgba(138, 67, 30, 0.06);
}
.glass-dark {
  background: rgba(26, 20, 17, 0.35);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 0.5px solid rgba(255,255,255,0.15);
  box-shadow:
    inset 1.5px 1.5px 1px rgba(255,255,255,0.15),
    0 6px 24px rgba(0,0,0,0.2);
}

/* Shake animation for wrong OTP */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-8px); }
  30% { transform: translateX(8px); }
  45% { transform: translateX(-6px); }
  60% { transform: translateX(6px); }
  75% { transform: translateX(-3px); }
  90% { transform: translateX(3px); }
}
.shake { animation: shake 0.5s ease-in-out; }

/* Haptic ripple */
@keyframes haptic {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(2.2); opacity: 0; }
}
.haptic-ring {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 2px solid var(--accent);
  pointer-events: none;
  animation: haptic 0.4s ease-out forwards;
}

/* Splash pulse */
@keyframes splashPulse {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.08); opacity: 1; }
}
@keyframes splashRing {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(2.5); opacity: 0; }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

/* Rotating loader */
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Scene transition */
.scene-enter { animation: fadeIn 0.45s ease-out both; }

/* Button press */
.press:active { transform: scale(0.97); transition: transform 0.08s; }

/* Text select off inside app */
.app * { user-select: none; -webkit-user-select: none; }

/* Map pin pulse */
@keyframes pinPulse {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(3); opacity: 0; }
}

/* Dashboard shimmer */
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* No scroll on device */
.no-scroll { overflow: hidden !important; }

/* SF Pro Rounded fallback for numbers */
.num {
  font-family: "SF Pro Rounded", -apple-system, system-ui;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "ss01";
}

/* Heree wordmark */
.wordmark {
  font-family: -apple-system, "SF Pro Display", system-ui;
  font-weight: 800;
  letter-spacing: -0.04em;
}

</style>

  <script type="text/babel">
    const TWEAKS = /*EDITMODE-BEGIN*/{
      "accent": "#FF4A1E",
      "ambient": "warm",
      "splashRings": true
    }/*EDITMODE-END*/;

    const SCENES = ['splash', 'phone', 'otp', 'loading', 'dashboard'];
    const SCENE_LABELS = {
      splash: '01 Splash',
      phone: '02 Numer telefonu',
      otp: '03 OTP',
      loading: '04 Weryfikacja',
      dashboard: '05 Dashboard',
    };

    const ACCENTS = {
      '#FF4A1E': { light: '#FF8A65', deep: '#E8441E' },
      '#7C5CFF': { light: '#A590FF', deep: '#5A3DE0' },
      '#00C2A8': { light: '#4DDFC9', deep: '#00957F' },
      '#FF5E8A': { light: '#FFA3BD', deep: '#E84870' },
    };

    const AMBIENTS = {
      warm: ['#FFB38A', '#FF7A45', '#FFD7A8', '#FF9466'],
      cool: ['#A8C8FF', '#5A8AFF', '#C5D9FF', '#7AA3FF'],
      violet: ['#D4A8FF', '#9B5AFF', '#E5C9FF', '#B67AFF'],
      night: ['#3A3049', '#1a1220', '#4a3855', '#2a1d30'],
    };

    function App() {
      const savedScene = localStorage.getItem('heree.scene') || 'splash';
      const [scene, setScene] = React.useState(savedScene);
      const [phone, setPhone] = React.useState('');
      const [tweaks, setTweaks] = React.useState(TWEAKS);
      const [tweaksOpen, setTweaksOpen] = React.useState(false);
      const [editModeActive, setEditModeActive] = React.useState(false);

      React.useEffect(() => { localStorage.setItem('heree.scene', scene); }, [scene]);

      // Apply tweaks to CSS vars
      React.useEffect(() => {
        const a = tweaks.accent || '#FF4A1E';
        const palette = ACCENTS[a] || ACCENTS['#FF4A1E'];
        document.documentElement.style.setProperty('--accent', a);
        document.documentElement.style.setProperty('--accent-light', palette.light);
        document.documentElement.style.setProperty('--accent-deep', palette.deep);
      }, [tweaks.accent]);

      // Host edit-mode protocol
      React.useEffect(() => {
        const handler = (e) => {
          if (e.data?.type === '__activate_edit_mode') setEditModeActive(true);
          if (e.data?.type === '__deactivate_edit_mode') { setEditModeActive(false); setTweaksOpen(false); }
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      const updateTweak = (k, v) => {
        setTweaks(t => {
          const next = { ...t, [k]: v };
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
          return next;
        });
      };

      const go = (s) => setScene(s);
      const curIdx = SCENES.indexOf(scene);

      const amb = AMBIENTS[tweaks.ambient] || AMBIENTS.warm;

      const renderScene = () => {
        switch (scene) {
          case 'splash':
            return <SplashScreen onDone={() => go('phone')} />;
          case 'phone':
            return <PhoneScreen
              onContinue={(p) => { setPhone(p); go('otp'); }}
              onDemo={() => go('dashboard')}
            />;
          case 'otp':
            return <OtpScreen
              phone={phone || '+48 600 000 000'}
              onSuccess={() => go('loading')}
              onBack={() => go('phone')}
            />;
          case 'loading':
            return <LoadingScreen onDone={() => go('dashboard')} />;
          case 'dashboard':
            return <Dashboard />;
          default:
            return null;
        }
      };

      // Ambient gradient as inline styles so tweaks work
      const ambientStyle = {
        position: 'absolute', inset: 0, overflow: 'hidden', zIndex: 0,
      };

      return (
        <div className="stage">
          {/* Chrome */}
          <div className="stage-chrome" data-screen-label={SCENE_LABELS[scene]}>
            {SCENES.map((s, i) => (
              <div key={s}
                   onClick={() => go(s)}
                   className={`step-dot ${i === curIdx ? 'active' : i < curIdx ? 'done' : ''}`}
                   style={{ cursor: 'pointer' }}
                   title={SCENE_LABELS[s]}
              />
            ))}
            <span style={{ marginLeft: 12 }}>{SCENE_LABELS[scene]}</span>
          </div>

          {/* Device */}
          <IOSDevice width={390} height={844}>
            <div className="app" style={{
              position: 'absolute', inset: 0, overflow: 'hidden',
              background: scene === 'dashboard' ? '#EFE7DB' : `
                radial-gradient(900px 700px at 10% -10%, ${amb[0]}80 0%, transparent 55%),
                radial-gradient(800px 600px at 110% 110%, ${amb[2]}70 0%, transparent 55%),
                #F5EEE4
              `,
            }}>
              {/* Ambient blobs (only on non-dashboard scenes) */}
              {scene !== 'dashboard' && (
                <div style={ambientStyle}>
                  <div style={{
                    position: 'absolute', width: 420, height: 420, borderRadius: '50%',
                    filter: 'blur(70px)', opacity: 0.75,
                    background: `radial-gradient(circle, ${amb[0]} 0%, ${amb[1]} 55%, transparent 70%)`,
                    top: -120, left: -80,
                    animation: 'blobA 18s ease-in-out infinite',
                  }} />
                  <div style={{
                    position: 'absolute', width: 380, height: 380, borderRadius: '50%',
                    filter: 'blur(70px)', opacity: 0.75,
                    background: `radial-gradient(circle, ${amb[2]} 0%, ${amb[3]} 60%, transparent 75%)`,
                    bottom: -140, right: -100,
                    animation: 'blobB 22s ease-in-out infinite',
                  }} />
                </div>
              )}
              <style>{`
                @keyframes blobA {
                  0%, 100% { transform: translate(0, 0) scale(1); }
                  50% { transform: translate(40px, 60px) scale(1.1); }
                }
                @keyframes blobB {
                  0%, 100% { transform: translate(0, 0) scale(1); }
                  50% { transform: translate(-30px, -40px) scale(1.08); }
                }
              `}</style>

              {renderScene()}
            </div>
          </IOSDevice>

          {/* Nav helpers */}
          <div style={{ display: 'flex', gap: 8, marginTop: 2 }}>
            <div className="chip-nav" onClick={() => go(SCENES[Math.max(0, curIdx - 1)])}>← Wstecz</div>
            <div className="chip-nav" onClick={() => go('splash')}>⟲ Restart</div>
            <div className="chip-nav" onClick={() => go(SCENES[Math.min(SCENES.length - 1, curIdx + 1)])}>Dalej →</div>
          </div>

          {/* Tweaks panel */}
          {editModeActive && (
            <div style={{
              position: 'fixed', right: 20, bottom: 20, zIndex: 100,
              display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 10,
            }}>
              <div className={`tweaks ${tweaksOpen ? 'open' : ''}`}>
                <h3>Tweaks</h3>

                <label>Kolor akcentu</label>
                <div className="tweak-group">
                  {Object.keys(ACCENTS).map(c => (
                    <div key={c}
                         className={`tweak-color ${tweaks.accent === c ? 'sel' : ''}`}
                         style={{ background: c }}
                         onClick={() => updateTweak('accent', c)}
                    />
                  ))}
                </div>

                <label>Ambient</label>
                <div className="tweak-group">
                  {['warm', 'cool', 'violet', 'night'].map(a => (
                    <div key={a}
                         className={`tweak-btn ${tweaks.ambient === a ? 'sel' : ''}`}
                         onClick={() => updateTweak('ambient', a)}
                    >{a}</div>
                  ))}
                </div>

                <label>Ekran</label>
                <div className="tweak-group">
                  {SCENES.map(s => (
                    <div key={s}
                         className={`tweak-btn ${scene === s ? 'sel' : ''}`}
                         onClick={() => go(s)}
                    >{SCENE_LABELS[s].slice(3)}</div>
                  ))}
                </div>
              </div>

              <div
                onClick={() => setTweaksOpen(o => !o)}
                style={{
                  width: 48, height: 48, borderRadius: '50%',
                  background: 'linear-gradient(180deg, #FF7A55 0%, #FF4A1E 100%)',
                  boxShadow: '0 6px 16px rgba(255,74,30,0.35)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  cursor: 'pointer', color: '#fff', fontSize: 20,
                }}
              >
                {tweaksOpen ? '×' : '⚙'}
              </div>
            </div>
          )}
        </div>
      );
    }

    function mountWhenReady() {
      if (typeof IOSDevice === 'undefined' ||
          typeof SplashScreen === 'undefined' ||
          typeof PhoneScreen === 'undefined' ||
          typeof OtpScreen === 'undefined' ||
          typeof LoadingScreen === 'undefined' ||
          typeof Dashboard === 'undefined' ||
          typeof HereePin === 'undefined' ||
          typeof NumericKeypad === 'undefined') {
        return setTimeout(mountWhenReady, 30);
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    mountWhenReady();
  </script>
</body>
</html>
