<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Heree — Rejestracja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Deep navy base (dominant cool) — complementary to warm coral accent */
    --bg-0: #060A14;        /* deepest */
    --bg-1: #0B1220;        /* app base */
    --bg-2: #131C2E;        /* card */
    --bg-3: #1C2740;        /* elevated card */
    --bg-4: #2A3654;        /* hover */

    /* Strokes — visible but subtle */
    --stroke: rgba(184, 194, 208, 0.14);
    --stroke-strong: rgba(184, 194, 208, 0.28);

    /* Text — WCAG AAA on --bg-1 */
    --text: #F5F7FA;        /* 16.1:1 on bg-1 — AAA */
    --text-dim: #B8C2D0;    /* 8.5:1 on bg-1 — AAA */
    --text-faint: #7A8499;  /* 4.7:1 on bg-1 — AA */

    /* Warm accents — complementary to navy */
    --accent: #FF7A45;      /* coral — 5.2:1 on bg-1 — AA */
    --accent-soft: #FFA478; /* soft coral for hover */
    --accent-2: #FFC368;    /* amber */
    --accent-3: #5DD4B0;    /* teal — also complementary */
    --accent-danger: #FF6B7A;
    --accent-on: #0B1220;   /* text on accent fills */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter Tight', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #0A0306;
    color: var(--text);
    width: 100%; height: 100%;
    overflow: hidden;
  }
  body {
    background:
      radial-gradient(1100px 800px at 15% -10%, rgba(28, 39, 64, 0.6) 0%, transparent 55%),
      radial-gradient(900px 700px at 110% 110%, rgba(255, 122, 69, 0.08) 0%, transparent 55%),
      radial-gradient(700px 500px at 50% 50%, rgba(11, 18, 32, 0.4) 0%, transparent 60%),
      #060A14;
  }
  #root {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .stage-wrap {
    transform-origin: center center;
    will-change: transform;
  }
  .serif { font-family: 'Newsreader', 'New York', Georgia, serif; font-weight: 400; }
  .serif-i { font-family: 'Newsreader', 'New York', Georgia, serif; font-weight: 400; font-style: italic; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-weight: 700; letter-spacing: -0.03em; }

  /* Stage */
  .stage {
    width: 100%; max-width: 460px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .stage-top {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .stage-top .dots { display: flex; gap: 5px; align-items: center; }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(184,194,208,0.14); transition: all 0.35s ease;
  }
  .dot.done { background: rgba(255,122,69,0.6); }
  .dot.active { background: var(--accent); width: 18px; border-radius: 100px; box-shadow: 0 0 12px rgba(255,138,91,0.6); }
  .stage-label { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; }

  /* Device */
  .device {
    position: relative;
    width: 390px; height: 844px;
    border-radius: 56px;
    background: linear-gradient(145deg, #1C2740 0%, #060A14 100%);
    padding: 10px;
    box-shadow:
      0 60px 120px -20px rgba(0,0,0,0.75),
      0 30px 60px -10px rgba(28,39,64,0.4),
      inset 0 1px 0 rgba(184,194,208,0.10),
      inset 0 -1px 0 rgba(0,0,0,0.5);
  }
  .screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 46px;
    background: var(--bg-1);
    isolation: isolate;
  }
  .island {
    position: absolute;
    top: 11px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 36px;
    background: #000; border-radius: 100px;
    z-index: 50;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 30px 0;
    font-size: 15px; font-weight: 600;
    color: var(--text);
    z-index: 40;
    pointer-events: none;
  }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 100px;
    background: rgba(245,247,250,0.45);
    z-index: 40;
  }

  /* App container */
  .app {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 46px;
    overflow: hidden;
    background:
      radial-gradient(440px 340px at 12% 6%, rgba(255,122,69,0.16), transparent 60%),
      radial-gradient(500px 420px at 95% 95%, rgba(93,212,176,0.08), transparent 60%),
      radial-gradient(340px 240px at 85% 20%, rgba(255,195,104,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  }
  .scene {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    padding: 54px 0 30px 0;
    z-index: 10;
    color: var(--text);
  }

  /* Glass surfaces */
  .glass {
    background: rgba(184, 194, 208, 0.08);
    border: 0.5px solid var(--stroke-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 6px 24px rgba(0,0,0,0.35);
    backdrop-filter: blur(20px);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 100px;
    background: rgba(184,194,208,0.08);
    border: 0.5px solid var(--stroke);
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  /* Buttons */
  .btn-primary {
    width: 100%; height: 56px;
    border: none; border-radius: 28px;
    font-family: inherit; font-size: 17px; font-weight: 600;
    color: var(--accent-on);
    background: linear-gradient(180deg, #FFA478 0%, #FF7A45 55%, #E85F2C 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -1px 0 rgba(0,0,0,0.2),
      0 10px 24px -4px rgba(255,122,69,0.45);
    cursor: pointer;
    transition: transform 0.12s ease;
    letter-spacing: -0.01em;
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-ghost {
    height: 44px; padding: 0 18px;
    border-radius: 22px;
    background: transparent;
    border: 0.5px solid var(--stroke-strong);
    color: var(--text); font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { background: rgba(184,194,208,0.08); }

  /* Demo banner */
  .demo-banner {
    position: absolute; top: 0; left: 0; right: 0; z-index: 45;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px 8px 18px;
    background: linear-gradient(90deg, rgba(255,195,104,0.95), rgba(255,138,91,0.95));
    color: var(--accent-on);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .demo-banner .exit {
    background: #1E080E; color: #FFC368;
    border: none; border-radius: 100px;
    padding: 6px 12px; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .demo-banner .exit:hover { background: #2A0D16; }

  /* Animations */
  @keyframes sceneIn { from { transform: translateY(6px); } to { transform: translateY(0); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.85; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-10px); } 30% { transform: translateX(10px); }
    45% { transform: translateX(-7px); } 60% { transform: translateX(7px); }
    75% { transform: translateX(-3px); } 90% { transform: translateX(3px); }
  }
  @keyframes ping {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(3); opacity: 0; }
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes rise { from { transform: translateY(8px); } to { transform: translateY(0); } }

  .scene-enter { animation: sceneIn 0.35s cubic-bezier(.2,.7,.2,1); }
  @media (prefers-reduced-motion: reduce) {
    .scene-enter { animation: none !important; }
  }
  .shake { animation: shake 0.5s ease-in-out; }

  .stage-bottom {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 14px; border-radius: 100px;
    background: rgba(30, 8, 14, 0.65);
    border: 0.5px solid var(--stroke);
    backdrop-filter: blur(20px);
  }
  .stage-bottom button {
    font-family: inherit;
    background: transparent; border: none; color: var(--text-dim);
    font-size: 13px; font-weight: 500; padding: 6px 12px;
    border-radius: 100px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .stage-bottom button:hover { background: rgba(184,194,208,0.08); color: var(--text); }
  .stage-bottom button.primary { background: rgba(255,122,69,0.16); color: var(--accent); }
  .stage-bottom button.primary:hover { background: rgba(255,122,69,0.28); }

  .app::-webkit-scrollbar, .scene::-webkit-scrollbar { display: none; }

  .tweaks {
    position: fixed; right: 24px; bottom: 24px; z-index: 999;
    width: 280px; padding: 18px;
    background: rgba(30, 8, 14, 0.9);
    border: 0.5px solid var(--stroke-strong);
    border-radius: 20px;
    backdrop-filter: blur(30px);
    color: var(--text);
    display: none;
    font-size: 13px;
  }
  .tweaks h4 { margin: 0 0 12px 0; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .tweaks label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--text-dim); gap: 10px; }
  .tweaks select {
    background: rgba(184,194,208,0.10); color: var(--text); border: 0.5px solid var(--stroke-strong);
    border-radius: 10px; padding: 6px 10px; font-size: 12px; font-family: inherit;
  }
  .tweaks .swatch-row { display: flex; gap: 6px; }
  .tweaks .swatch {
    width: 24px; height: 24px; border-radius: 8px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.15s;
  }
  .tweaks .swatch.sel { border-color: var(--text); transform: scale(1.1); }
</style>

<script>
try { localStorage.removeItem('heree.scene'); } catch(e) {}
</script>
</head>
<body>
  <div id="root"></div>
  <div class="tweaks" id="tweaks-panel">
    <h4>Tweaks</h4>
    <label>Akcent
      <div class="swatch-row" id="tw-accent">
        <div class="swatch sel" data-c="#FF7A45" style="background:#FF7A45"></div>
        <div class="swatch" data-c="#FFC368" style="background:#FFC368"></div>
        <div class="swatch" data-c="#5DD4B0" style="background:#5DD4B0"></div>
        <div class="swatch" data-c="#9DB6FF" style="background:#9DB6FF"></div>
        <div class="swatch" data-c="#E6A6FF" style="background:#E6A6FF"></div>
      </div>
    </label>
    <label>Intensywność tła
      <input type="range" id="tw-bg" min="0" max="100" value="60">
    </label>
    <label>Tryb
      <select id="tw-mode">
        <option value="bordo">burgundowy (domyślny)</option>
        <option value="dark">czarny</option>
      </select>
    </label>
  </div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const Ic = {
  Arrow: ({ size = 18, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  Check: ({ size = 18, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  X: ({ size = 14, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M6 18L18 6" stroke={color} strokeWidth="2" strokeLinecap="round"/></svg>),
  Back: ({ size = 16, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  Lock: ({ size = 14, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke={color} strokeWidth="1.6"/><path d="M8 11V8a4 4 0 118 0v3" stroke={color} strokeWidth="1.6"/></svg>),
  Pin: ({ size = 16, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" stroke={color} strokeWidth="1.6"/><circle cx="12" cy="9" r="2.5" stroke={color} strokeWidth="1.6"/></svg>),
  Restart: ({ size = 14, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  Sparkle: ({ size = 14, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z" fill={color}/></svg>),
  Heart: ({ size = 14, color = 'currentColor' }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M12 21s-8-5-8-11.5A4.5 4.5 0 0112 5a4.5 4.5 0 018 4.5C20 16 12 21 12 21z" fill={color}/></svg>),
};

/* Status bar */
function StatusBar() {
  return (
    <>
      <div className="island"/>
      <div className="statusbar">
        <div className="num" style={{fontWeight:600}}>9:41</div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0" y="8" width="3" height="3" rx="0.5" fill="#F5F7FA"/><rect x="4.5" y="6" width="3" height="5" rx="0.5" fill="#F5F7FA"/><rect x="9" y="3" width="3" height="8" rx="0.5" fill="#F5F7FA"/><rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#F5F7FA"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 10.5a1 1 0 100-2 1 1 0 000 2zM4.5 6.5a5 5 0 017 0M1.5 3.5a9 9 0 0113 0" stroke="#F5F7FA" strokeWidth="1.5" strokeLinecap="round"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#F5F7FA" strokeOpacity="0.5"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="#F5F7FA"/><path d="M24 4v4c.7-.3 1.2-1.2 1.2-2S24.7 4.3 24 4z" fill="#F5F7FA" fillOpacity="0.5"/></svg>
        </div>
      </div>
    </>
  );
}

/* Demo banner */
function DemoBanner({ onExit }) {
  return (
    <div className="demo-banner" style={{animation:'slideDown 0.4s ease-out'}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div style={{
          width:18,height:18,borderRadius:5,background:'#0B1220',
          display:'flex',alignItems:'center',justifyContent:'center',color:'#FFC368',
          fontSize:10,fontWeight:700
        }}>D</div>
        <span>Tryb demo · przeglądasz bez konta</span>
      </div>
      <button className="exit" onClick={onExit}>
        Wyjdź <Ic.X size={11}/>
      </button>
    </div>
  );
}

/* Scene 01 — Splash */
function Splash({ onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 1700); return () => clearTimeout(t); }, []);
  return (
    <div className="scene scene-enter" style={{alignItems:'center',justifyContent:'center'}}>
      <div style={{position:'relative',width:160,height:160,marginBottom:28}}>
        <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'1px solid rgba(255,122,69,0.34)',animation:'ping 1.4s ease-out infinite'}}/>
        <div style={{position:'absolute',inset:20,borderRadius:'50%',border:'1px solid rgba(255,122,69,0.45)',animation:'ping 1.4s ease-out 0.4s infinite'}}/>
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',animation:'pulse 2s ease-in-out infinite'}}>
          <div style={{
            width:108,height:108,borderRadius:'50%',
            background: 'radial-gradient(circle at 30% 30%, #FFC368 0%, #FF7A45 55%, #C04A1F 100%)',
            boxShadow:'0 0 60px rgba(255,122,69,0.6), inset 0 -14px 26px rgba(0,0,0,0.4), inset 0 8px 14px rgba(255,235,220,0.5)',
            display:'flex',alignItems:'center',justifyContent:'center',
            color:'#131C2E',fontSize:48,fontWeight:800,letterSpacing:'-0.06em',
            fontFamily:"-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          }}>h</div>
        </div>
      </div>
      <div style={{fontFamily:"'Newsreader', Georgia, serif",fontSize:44,letterSpacing:'-0.02em',color:'var(--text)',lineHeight:1}}>
        heree<span style={{color:'var(--accent)'}}>.</span>
      </div>
      <div style={{marginTop:14,fontSize:11,letterSpacing:'0.24em',textTransform:'uppercase',color:'var(--text-faint)',fontFamily:"'JetBrains Mono', ui-monospace, monospace"}}>
        twoja ulica · twoi ludzie
      </div>
    </div>
  );
}

/* Keypad */
function Keypad({ onPress, onBack }) {
  const keys = ['1','2','3','4','5','6','7','8','9','','0','<'];
  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:8}}>
      {keys.map((k,i) => {
        if (k === '') return <div key={i}/>;
        if (k === '<') return (
          <button key={i} onClick={onBack} style={{
            height:50,border:'none',borderRadius:16,
            background:'rgba(184,194,208,0.04)',
            color:'var(--text-dim)',fontFamily:'inherit',cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center'
          }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20 5H9L3 12l6 7h11a1 1 0 001-1V6a1 1 0 00-1-1z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M11 9l5 6m0-6l-5 6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
          </button>
        );
        return (
          <button key={i} onClick={()=>onPress(k)} className="num" style={{
            height:50,border:'none',borderRadius:16,
            background:'rgba(184,194,208,0.07)',
            border:'0.5px solid var(--stroke)',
            color:'var(--text)',fontSize:24,fontWeight:400,fontFamily:'inherit',cursor:'pointer'
          }}>{k}</button>
        );
      })}
    </div>
  );
}

/* Scene 02 — Phone */
function Phone({ onNext, onDemo }) {
  const [digits, setDigits] = useState('');
  const [consent, setConsent] = useState(false);

  const formatted = useMemo(() => {
    const g = digits.match(/.{1,3}/g);
    return g ? g.join(' ') : '';
  }, [digits]);

  const press = (d) => { if (digits.length >= 9) return; setDigits(digits + d); };
  const back = () => setDigits(digits.slice(0, -1));
  const ok = digits.length === 9 && consent;

  return (
    <div className="scene scene-enter" style={{padding:'70px 22px 28px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
        <div className="chip"><Ic.Lock color="var(--text-dim)"/> szyfrowane</div>
        <button onClick={onDemo} style={{
          background:'transparent',border:'0.5px solid var(--stroke-strong)',borderRadius:100,
          padding:'6px 12px',fontSize:11,color:'var(--text-dim)',fontFamily:'inherit',cursor:'pointer',
          display:'inline-flex',alignItems:'center',gap:6

/* Scene 03 — OTP */
function Otp({ phone, onNext, onBack }) {
  const [code, setCode] = useState(['','','','','','']);
  const [error, setError] = useState(false);
  const [resendIn, setResendIn] = useState(38);
  const [autoFillHint, setAutoFillHint] = useState(true);
  const [shake, setShake] = useState(false);

  useEffect(() => {
    if (resendIn <= 0) return;
    const t = setTimeout(() => setResendIn(resendIn - 1), 1000);
    return () => clearTimeout(t);
  }, [resendIn]);

  useEffect(() => {
    const t = setTimeout(() => {
      setAutoFillHint(false);
      const correct = ['4','8','2','1','5','7'];
      let i = 0;
      const iv = setInterval(() => {
        setCode(c => { const n = [...c]; n[i] = correct[i]; return n; });
        i++;
        if (i === 6) {
          clearInterval(iv);
          setTimeout(() => onNext(), 500);
        }
      }, 110);
    }, 2000);
    return () => clearTimeout(t);
  }, []);

  const press = (d) => {
    const i = code.findIndex(c => c === '');
    if (i < 0) return;
    const next = [...code]; next[i] = d; setCode(next);
    if (i === 5) {
      const joined = next.join('');
      if (joined !== '482157') {
        setShake(true); setError(true);
        setTimeout(() => { setShake(false); setCode(['','','','','','']); setError(false); }, 700);
      } else {
        setTimeout(() => onNext(), 400);
      }
    }
  };
  const back = () => {
    const i = code.findIndex(c => c === '');
    const idx = i < 0 ? 5 : i - 1;
    if (idx < 0) return;
    const next = [...code]; next[idx] = ''; setCode(next);
  };
  const maskedPhone = phone ? '+48 ' + phone.slice(0,3) + ' ••• ' + phone.slice(6) : '+48 ••• ••• •••';

  return (
    <div className="scene scene-enter" style={{padding:'70px 22px 28px'}}>
      <button onClick={onBack} className="chip" style={{alignSelf:'flex-start',cursor:'pointer',marginBottom:20,background:'rgba(184,194,208,0.08)',border:'0.5px solid var(--stroke-strong)',fontFamily:'inherit',color:'var(--text-dim)'}}>
        <Ic.Back color="var(--text-dim)"/> zmień numer
      </button>
      <div style={{fontFamily:"'Newsreader', Georgia, serif",fontSize:38,lineHeight:1,letterSpacing:'-0.02em',marginBottom:6}}>
        Kod z <span className="serif-i" style={{color:'var(--accent)'}}>SMS-a</span>
      </div>
      <div style={{fontSize:14,color:'var(--text-dim)',marginBottom:22}}>
        Wysłano na <span className="num" style={{color:'var(--text)'}}>{maskedPhone}</span>
      </div>

      {autoFillHint && (
        <div className="glass" style={{
          display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:14,marginBottom:16,
          animation:'slideDown 0.5s ease-out both'
        }}>
          <div style={{width:24,height:24,borderRadius:8,background:'rgba(255,122,69,0.2)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Ic.Sparkle size={12} color="var(--accent)"/>
          </div>
          <div style={{flex:1,fontSize:12.5,color:'var(--text-dim)'}}>
            Z iPhone'a · autouzupełnianie
          </div>
          <div style={{width:14,height:14,borderRadius:'50%',border:'1.5px solid var(--accent)',borderTopColor:'transparent',animation:'spin 0.7s linear infinite'}}/>
        </div>
      )}

      <div className={shake ? 'shake' : ''} style={{display:'grid',gridTemplateColumns:'repeat(6, 1fr)',gap:8,marginBottom:14}}>
        {code.map((c,i) => {
          const active = c === '' && i === code.findIndex(x => x === '');
          return (
            <div key={i} className="num" style={{
              aspectRatio:'1/1.1', borderRadius:14,
              background: error ? 'rgba(255,107,122,0.16)' : 'rgba(184,194,208,0.07)',
              border: error ? '1px solid #FF6B7A'
                : (active ? '1px solid var(--accent)' : '0.5px solid var(--stroke-strong)'),
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:28,fontWeight:500,
              color: error ? '#FF6B7A' : 'var(--text)',
              boxShadow: active ? '0 0 0 4px rgba(255,122,69,0.11)' : 'none',
              transition:'all 0.15s'
            }}>
              {c || (active ? <span style={{width:2,height:24,background:'var(--accent)',animation:'pulse 1s ease-in-out infinite'}}/> : '')}
            </div>
          );
        })}
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'auto',fontSize:12}}>
        <span style={{color:error ? '#FF6B7A' : 'var(--text-faint)'}}>
          {error ? 'Kod niepoprawny' : 'Kod ważny 10 min'}
        </span>
        {resendIn > 0 ? (
          <span style={{color:'var(--text-faint)'}} className="num">
            wyślij ponownie · 0:{String(resendIn).padStart(2,'0')}
          </span>
        ) : (
          <span style={{color:'var(--accent)',cursor:'pointer'}}>wyślij ponownie</span>
        )}
      </div>

      <div style={{marginTop:16}}>
        <Keypad onPress={press} onBack={back}/>
      </div>
    </div>
  );
}

function App() {
  const [sceneId, setSceneId] = useState('splash');
  const [phone, setPhone] = useState('');
  const [demoMode, setDemoMode] = useState(false);
  const idx = SCENES.findIndex(s => s.id === sceneId);

  const go = (id) => setSceneId(id);
  const next = () => { if (idx < SCENES.length - 1) setSceneId(SCENES[idx+1].id); };
  const prev = () => { if (idx > 0) setSceneId(SCENES[idx-1].id); };
  const restart = () => { setPhone(''); setDemoMode(false); setSceneId('splash'); };
  const exitDemo = () => { setDemoMode(false); setSceneId('phone'); setPhone(''); };
  const enterDemo = () => { setDemoMode(true); setPhone('501234567'); setSceneId('dashboard'); };

  let content;
  if (sceneId === 'splash') content = <Splash onDone={() => go('phone')}/>;
  else if (sceneId === 'phone') content = <Phone onNext={(p)=>{setPhone(p); go('otp');}} onDemo={enterDemo}/>;
  else if (sceneId === 'otp') content = <Otp phone={phone} onNext={()=>go('loading')} onBack={()=>go('phone')}/>;
  else if (sceneId === 'loading') content = <Loading onDone={()=>go('dashboard')}/>;
  else if (sceneId === 'dashboard') content = <Dashboard demoMode={demoMode} onExitDemo={exitDemo}/>;

  return (
    <div className="stage-wrap"><div className="stage">
      <div className="stage-top">

      <div className="stage-bottom">

          <Ic.Back/> Wstecz

        <button className="primary" onClick={next} disabled={idx === SCENES.length - 1} style={{opacity: idx===SCENES.length-1 ? 0.35 : 1}}>
          Dalej <Ic.Arrow size={14}/>

      </div>
    </div></div>
  );
}

/* Auto-scale stage to viewport */
function fitStage() {
  const wrap = document.querySelector('.stage-wrap');
  if (!wrap) { requestAnimationFrame(fitStage); return; }
  wrap.style.transform = 'scale(1)';
  const r = wrap.getBoundingClientRect();
  if (r.width === 0 || r.height === 0) { requestAnimationFrame(fitStage); return; }
  // r is post-scale=1, but transform-origin is center; use offsetWidth/Height for unscaled
  const w = wrap.offsetWidth;
  const h = wrap.offsetHeight;
  const sx = (window.innerWidth - 24) / w;
  const sy = (window.innerHeight - 24) / h;
  const s = Math.min(1, sx, sy);
  wrap.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', () => setTimeout(fitStage, 100));
setTimeout(fitStage, 200);

    document.body.style.filter = 'saturate(' + (0.6 + n/100) + ') brightness(' + (0.9 + n/200) + ')';
  });
  document.getElementById('tw-mode').addEventListener('change', e => applyMode(e.target.value));

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode') panel.style.display = 'block';
    if (d.type === '__deactivate_edit_mode') panel.style.display = 'none';
  });
  window.parent.postMessage({type: '__edit_mode_available'}, '*');
})();
</script>
</body>
</html>
